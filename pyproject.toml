[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Compression-HELIX"
version = "1.0.0"
description = "Compression-optimized HELIX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kapil Dhinwa"}]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/Compression-HELIX"

[tool.setuptools]
packages = ["compression_helix"]
