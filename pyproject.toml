[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compression_helix"
version = "0.1.0"
description = "Compression-HELIX - Compression pipeline fused with HELIX memory storage"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
